aid: ironio
name: Iron.io
description: 'Iron.io provides hosted serverless infrastructure for background processing and asynchronous
  messaging. Its flagship products are IronMQ, a high-performance hosted message queue for passing messages
  and events between processes and systems with support for push queues, subscribers, and long-polling;
  IronWorker, a container-based, multi-language, work-on-demand platform for running background jobs and
  scheduled tasks at scale; and IronCache, a hosted key/value store. All services share a single REST/HTTP
  API authenticated with per-project OAuth tokens obtained from the Iron.io HUD, and a broad set of official
  client libraries across Go, Ruby, Python, PHP, Java, Node.js, .NET, and Rust.'
